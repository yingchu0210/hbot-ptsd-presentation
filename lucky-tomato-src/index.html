<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>好運來小番茄</title>
<style>html,body{margin:0;background:#222}canvas{display:block}</style></head>
<body><canvas id="cv" width="1920" height="1080"></canvas>
<script src="qr.js"></script>
<script src="audio.js"></script>
<script>
const W=1920,H=1080,ctx=document.getElementById('cv').getContext('2d');
const INK='#38332d',RED='#d8432f',FONT='"WenQuanYi Zen Hei","Noto Sans CJK TC",sans-serif';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), lerp=(a,b,t)=>a+(b-a)*t;
const prog=(t,a,b)=>cl((t-a)/(b-a));
const back=x=>{x=cl(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const ease=x=>{x=cl(x);return x*x*(3-2*x)};
function hash(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)}
let FR=0,SC=0;
function J(a){SC++;return (hash(SC*12.9898+FR*78.233)-.5)*2*a}

/* ---------- paper ---------- */
const paper=document.createElement('canvas');paper.width=W;paper.height=H;
(function(){const p=paper.getContext('2d');p.fillStyle='#f4ecd9';p.fillRect(0,0,W,H);
let s=7;const r=()=>{s=(s*16807)%2147483647;return s/2147483647};
for(let i=0;i<260;i++){p.fillStyle=`rgba(${150+r()*40|0},${130+r()*30|0},90,${r()*0.05})`;p.beginPath();p.ellipse(r()*W,r()*H,40+r()*160,30+r()*120,r()*3,0,7);p.fill()}
for(let i=0;i<9000;i++){p.fillStyle=`rgba(90,70,40,${r()*0.10})`;p.fillRect(r()*W,r()*H,1+r()*2,1+r()*2)}
for(let i=0;i<900;i++){p.strokeStyle=`rgba(120,100,70,${r()*0.08})`;p.lineWidth=1;p.beginPath();const x=r()*W,y=r()*H,a=r()*6.28,l=8+r()*30;p.moveTo(x,y);p.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);p.stroke()}
const g=p.createRadialGradient(W/2,H/2,H*0.45,W/2,H/2,H*0.95);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(90,60,20,0.28)');p.fillStyle=g;p.fillRect(0,0,W,H)})();

/* ---------- pencil primitives ---------- */
function smooth(pts,close){const n=pts.length;ctx.beginPath();
 if(n<3){ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n;i++)ctx.lineTo(pts[i][0],pts[i][1]);return}
 if(close){ctx.moveTo((pts[n-1][0]+pts[0][0])/2,(pts[n-1][1]+pts[0][1])/2);
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];ctx.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}ctx.closePath()}
 else{ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n-1;i++){const p=pts[i],q=pts[i+1];ctx.quadraticCurveTo(p[0],p[1],(p[0]+q[0])/2,(p[1]+q[1])/2)}const l=pts[n-1];ctx.lineTo(l[0],l[1])}}
const jp=(pts,a)=>pts.map(p=>[p[0]+J(a),p[1]+J(a)]);
function stroke(pts,o={}){const w=o.w||4,c=o.c||INK,a=o.a??2.2;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.strokeStyle=c;ctx.lineWidth=w;ctx.globalAlpha=(o.al??1)*.9;smooth(jp(pts,a),!!o.close);ctx.stroke();
 ctx.lineWidth=w*.5;ctx.globalAlpha=(o.al??1)*.4;smooth(jp(pts,a*1.5),!!o.close);ctx.stroke();ctx.globalAlpha=1}
function fillS(pts,col,o={}){const a=o.a??2.2;ctx.globalAlpha=o.alpha??.92;ctx.fillStyle=col;
 smooth(jp(pts.map(p=>[p[0]+3,p[1]+3]),a*.5),true);ctx.fill();ctx.globalAlpha=1;
 if(o.line!==false)stroke(pts,{close:true,a,w:o.w||4,c:o.c})}
function ell(cx,cy,rx,ry,n=16,rot=0,a0=0,a1=6.283){const p=[];const full=a1-a0>6.2;for(let i=0;i<(full?n:n+1);i++){const t=a0+(a1-a0)*i/n;const x=Math.cos(t)*rx,y=Math.sin(t)*ry;p.push([cx+x*Math.cos(rot)-y*Math.sin(rot),cy+x*Math.sin(rot)+y*Math.cos(rot)])}return p}
function rrect(x,y,w,h,r=14){return [[x+r,y],[x+w/2,y-2],[x+w-r,y],[x+w,y+r],[x+w+2,y+h/2],[x+w,y+h-r],[x+w-r,y+h],[x+w/2,y+h+2],[x+r,y+h],[x,y+h-r],[x-2,y+h/2],[x,y+r]]}
function txt(s,x,y,o={}){const size=o.size||60;ctx.save();ctx.translate(x+J(1.2),y+J(1.2));ctx.rotate((o.rot||0)+J(.004));
 ctx.font=`bold ${size}px ${FONT}`;ctx.textAlign=o.align||'center';ctx.textBaseline='middle';ctx.globalAlpha=o.alpha??1;
 ctx.fillStyle=o.col||INK;ctx.fillText(s,0,0);ctx.strokeStyle=o.col||INK;ctx.lineWidth=size*0.03;ctx.lineJoin='round';ctx.strokeText(s,0,0);ctx.restore()}
function limb(pts,w,col){const q=jp(pts,1.6);ctx.lineCap='round';ctx.lineJoin='round';
 ctx.strokeStyle=INK;ctx.lineWidth=w+7;smooth(q,false);ctx.stroke();ctx.strokeStyle=col;ctx.lineWidth=w;smooth(q,false);ctx.stroke()}
function spark(x,y,r,col='#f2b705',rot=0){stroke([[x,y-r],[x+r*.2,y-r*.2],[x+r,y],[x+r*.2,y+r*.2],[x,y+r],[x-r*.2,y+r*.2],[x-r,y],[x-r*.2,y-r*.2]],{close:true,w:3,c:col,a:1})}
function heart(x,y,r,col='#e86a7a'){fillS([[x,y+r*.9],[x-r*.9,y-r*.1],[x-r*.6,y-r*.8],[x,y-r*.4],[x+r*.6,y-r*.8],[x+r*.9,y-r*.1]],col,{w:3,a:1})}
function clover(x,y,r){stroke([[x,y+r*.6],[x+r*.1,y+r*1.4],[x-r*.1,y+r*2.2]],{w:6,c:'#4f8f48'});
 for(let k=0;k<4;k++){const a=k*Math.PI/2+Math.PI/4;fillS(ell(x+Math.cos(a)*r*.55,y+Math.sin(a)*r*.55,r*.52,r*.42,12,a),'#7cc46a',{w:3.5,a:1.5})}}
function grassLine(y){ctx.globalAlpha=.4;ctx.fillStyle='#cfe0a8';ctx.fillRect(0,y,W,H-y);ctx.globalAlpha=1;
 const pts=[];for(let x=-20;x<=W+20;x+=120)pts.push([x,y+Math.sin(x*.01)*4]);stroke(pts,{w:4,a:2.5});
 for(let x=60;x<W;x+=170){const gy=y+8;stroke([[x,gy],[x-8,gy-22],[x-14,gy-30]],{w:3,c:'#5f9a4c',a:1});stroke([[x+6,gy],[x+8,gy-28]],{w:3,c:'#5f9a4c',a:1});stroke([[x+12,gy],[x+22,gy-20]],{w:3,c:'#5f9a4c',a:1})}}

/* ---------- tomato ---------- */
function tomato(x,y,r,col,o={}){const rot=o.rot||0,long=!!o.long;const rx=long?r*.7:r,ry=long?r*1.15:r*.95;
 fillS(ell(x,y,rx,ry,14,rot),col,{w:3.5,a:1.4});
 stroke([[x-rx*.45,y-ry*.1],[x-rx*.4,y-ry*.45],[x-rx*.15,y-ry*.6]].map(p=>[x+(p[0]-x)*Math.cos(rot)-(p[1]-y)*Math.sin(rot),y+(p[0]-x)*Math.sin(rot)+(p[1]-y)*Math.cos(rot)]),{w:3,c:'#fff',al:.8,a:.8});
 const tx=x+ry*Math.sin(rot),ty=y-ry*Math.cos(rot);
 for(let k=0;k<5;k++){const a=-Math.PI/2+rot+(k-2)*.9;stroke([[tx,ty],[tx+Math.cos(a)*r*.38,ty+Math.sin(a)*r*.38+r*.06]],{w:4,c:'#4f8f48',a:.8})}}

/* ---------- people ---------- */
function person(o){
 const t=o.t||0,s=o.s||1,fl=o.flip||1,kind=o.kind;
 const bob=Math.sin(t*5+(o.ph||0))*(o.bob??3);
 ctx.save();ctx.translate(o.x,o.y);ctx.scale(s*fl,s);
 const hipY=-175,shY=-315,hy=-395+bob;
 const skin='#f6d3b0';
 const shirt={dad:'#4d7ea3',mom:'#35b3a2',girl:'#e58aa0'}[kind];
 const pants={dad:'#6c6f7a',mom:'#a8d8ee',girl:'#403b47'}[kind];
 const shoe={dad:'#5a4a3c',mom:'#7a6552',girl:'#ffffff'}[kind];
 const sleeve=kind==='mom'?'#2d63b0':shirt;
 const hand=kind==='mom'?'#8a84a0':skin;
 // back things
 if(kind==='mom'){ // neck flaps + curls
  fillS([[-98,hy-40],[-120,shY+14],[-72,shY+34],[-60,hy+8]],'#ec8fa0',{w:3.5});
  fillS([[98,hy-40],[120,shY+14],[72,shY+34],[60,hy+8]],'#ec8fa0',{w:3.5});
  fillS(ell(-64,hy+8,30,34,10),'#cfa066',{w:3});fillS(ell(64,hy+8,30,34,10),'#cfa066',{w:3});}
 if(kind==='girl'){fillS([[-74,hy-20],[-84,hy+50],[-66,hy+80],[0,hy+70],[66,hy+80],[84,hy+50],[74,hy-20]],'#2f2a30',{w:3.5})}
 // legs
 const lL=o.legL||[[-30,hipY],[-32,-24]],lR=o.legR||[[30,hipY],[32,-24]];
 limb(lL,34,pants);limb(lR,34,pants);
 const fL=lL[lL.length-1],fR=lR[lR.length-1];
 fillS(ell(fL[0]-4,fL[1]+8,38,17,10),shoe,{w:3.5});fillS(ell(fR[0]+4,fR[1]+8,38,17,10),shoe,{w:3.5});
 if(kind==='mom'){stroke([[-38,-120],[-26,-104]],{w:4,c:'#4a9ac2',a:1});stroke([[30,-90],[42,-70]],{w:4,c:'#4a9ac2',a:1})}
 // torso
 ctx.save();ctx.translate(0,bob*.5);
 const puff=kind==='girl'?10:0;
 fillS([[-72-puff,shY],[0,shY-8],[72+puff,shY],[82+puff,hipY-30],[78+puff,hipY+16],[0,hipY+22],[-78-puff,hipY+16],[-82-puff,hipY-30]],shirt,{w:4});
 if(kind==='girl'){for(const yy of[-285,-245,-205])stroke([[-70,yy],[0,yy+6],[70,yy]],{w:3,c:'#c8667f',a:1.2});stroke([[0,shY+10],[0,hipY+16]],{w:3,c:'#b0556c',a:1})}
 if(kind==='mom'){fillS(ell(-8,-250,18,12,8,-.5),'#2a8a7c',{w:2.5,a:1,alpha:.7});fillS(ell(18,-250,18,12,8,.5),'#2a8a7c',{w:2.5,a:1,alpha:.7})}
 if(kind==='dad'){stroke([[-26,shY],[0,shY+22],[26,shY]],{w:3.5,a:1})}
 ctx.restore();
 // arms
 const sL=[-74,shY+12+bob*.5],sR=[74,shY+12+bob*.5];
 const hL=o.hl||[-104,-185],hR=o.hr||[104,-185];
 const elb=(sv,hv,dir)=>[(sv[0]+hv[0])/2+dir*14,(sv[1]+hv[1])/2+6];
 limb([sL,elb(sL,hL,-1),hL],30,sleeve);limb([sR,elb(sR,hR,1),hR],30,sleeve);
 fillS(ell(hL[0],hL[1],19,19,8),hand,{w:3,a:1});fillS(ell(hR[0],hR[1],19,19,8),hand,{w:3,a:1});
 // bag (girl)
 if(kind==='girl'){stroke([[60,shY+6],[-10,-250],[-70,hipY+30]],{w:9,c:'#2b2b2e',a:1.2});fillS(rrect(-118,hipY+10,86,62,10),'#2b2b2e',{w:3.5})}
 // head
 ctx.save();ctx.translate(0,0);
 fillS(ell(0,hy,63,68,16),skin,{w:4});
 if(kind==='dad'){fillS(ell(-66,hy+6,10,18,8),skin,{w:3,a:1});fillS(ell(66,hy+6,10,18,8),skin,{w:3,a:1});
  stroke([[-58,hy-26],[-70,hy-6],[-62,hy+16]],{w:9,c:'#a9a9a9',a:1.2});stroke([[58,hy-26],[70,hy-6],[62,hy+16]],{w:9,c:'#a9a9a9',a:1.2});
  stroke([[-30,hy-62],[0,hy-70],[28,hy-62]],{w:4,c:'#fff',al:.6,a:1})}
 if(kind==='girl'){fillS(ell(0,hy-42,70,38,14),'#2f2a30',{w:3.5});
  fillS([[-66,hy-14],[-40,hy-38],[0,hy-30],[40,hy-38],[66,hy-14],[40,hy-18],[0,hy-10],[-40,hy-18]],'#2f2a30',{w:2.5,a:1.2});
  stroke([[-22,hy-62],[-28,hy-34]],{w:4,c:'#c9c6cc',a:1});stroke([[16,hy-64],[22,hy-38]],{w:4,c:'#c9c6cc',a:1})}
 // face
 const ex=24,ey=hy+(kind==='girl'?4:-2);
 const happy=o.eyes==='happy',blink=(Math.floor(t*1.3+(o.ph||0))%5===0)&&((t*1.3+(o.ph||0))%1<.12);
 if(happy||blink){stroke([[-ex-9,ey+2],[-ex,ey-7],[-ex+9,ey+2]],{w:4,a:.8});stroke([[ex-9,ey+2],[ex,ey-7],[ex+9,ey+2]],{w:4,a:.8})}
 else{fillS(ell(-ex,ey,5.5,6.5,6),INK,{w:2,a:.5,alpha:1});fillS(ell(ex,ey,5.5,6.5,6),INK,{w:2,a:.5,alpha:1})}
 const br=kind==='dad'?'#8d8d8d':INK;
 if(o.mouth==='sad'){stroke([[-ex-12,ey-20],[-ex+8,ey-26]],{w:4,c:br,a:.8});stroke([[ex+12,ey-20],[ex-8,ey-26]],{w:4,c:br,a:.8})}
 else stroke([[-ex-10,ey-20],[-ex+8,ey-23]],{w:kind==='dad'?6:4,c:br,a:.8}),stroke([[ex+10,ey-20],[ex-8,ey-23]],{w:kind==='dad'?6:4,c:br,a:.8});
 const my=hy+30;
 const m=o.mouth||'smile';
 if(m==='smile'||m==='shy')stroke([[-17,my-2],[0,my+10],[17,my-2]],{w:4,a:.8});
 if(m==='big'||m==='eat'){fillS([[-24,my-4],[0,my+2],[24,my-4],[0,my+26]],'#8a3a3a',{w:3.5,a:1})}
 if(m==='sad')stroke([[-16,my+10],[0,my],[16,my+10]],{w:4,a:.8});
 if(m==='o')fillS(ell(0,my+4,8,10,8),'#8a3a3a',{w:3,a:1});
 if(m==='shy'||o.blush){fillS(ell(-40,my-8,13,8,8),'#f08a8a',{line:false,alpha:.55});fillS(ell(40,my-8,13,8,8),'#f08a8a',{line:false,alpha:.55})}
 if(kind==='mom'){ // hat
  fillS(ell(0,hy-50,120,27,18),'#ec8fa0',{w:4});
  fillS([[-72,hy-52],[-64,hy-96],[0,hy-116],[64,hy-96],[72,hy-52],[0,hy-40]],'#ec8fa0',{w:4});
  stroke([[-74,hy-40],[-60,hy+42],[0,hy+80],[60,hy+42],[74,hy-40]],{w:5,c:'#fffbe8',a:1.2});}
 if(kind==='girl'){ // scarf
  fillS(ell(0,shY-6,70,22,14),'#ef7d4a',{w:4});
  fillS([[34,shY+4],[62,shY+8],[56,shY+86],[28,shY+82]],'#ef7d4a',{w:3.5});
  stroke([[40,shY+20],[44,shY+60]],{w:3,c:'#c9482f',a:1});stroke([[-30,shY-10],[0,shY+6],[30,shY-10]],{w:3,c:'#c9482f',a:1})}
 ctx.restore();ctx.restore()}

/* ---------- background helpers ---------- */
function vines(x0,x1,y0,y1,n,seed=0){for(let i=0;i<n;i++){const x=lerp(x0,x1,i/(n-1));const pts=[];
 for(let k=0;k<=9;k++){pts.push([x+Math.sin(k*1.7+i)*18+(hash(i*3+k+seed)-.5)*16,lerp(y1,y0,k/9)])}
 stroke(pts,{w:7,c:'#8fbf6a',a:3,al:.8});
 for(let k=1;k<9;k+=2){const p=pts[k];fillS(ell(p[0]+(k%4?22:-22),p[1],20,10,8,k%4?.4:-.4),'#9bcc78',{w:2.5,a:1.5,alpha:.7})}
 for(let k=2;k<9;k+=3){const p=pts[k];tomato(p[0]+10,p[1]+14,9,k%2?'#e8513d':'#f4a23a',{long:true})}}}
function sun(x,y,r,p){ctx.save();ctx.translate(x,y);ctx.scale(back(p),back(p));
 fillS(ell(0,0,r,r,18),'#fbd25a',{w:4});for(let i=0;i<12;i++){const a=i/12*6.283+FR*.06;stroke([[Math.cos(a)*(r+16),Math.sin(a)*(r+16)],[Math.cos(a)*(r+44),Math.sin(a)*(r+44)]],{w:5,c:'#f2b705',a:1.5})}
 stroke([[-22,10],[0,26],[22,10]],{w:4,a:.8});fillS(ell(-18,-8,5,6,6),INK,{line:false,alpha:1});fillS(ell(18,-8,5,6,6),INK,{line:false,alpha:1});ctx.restore()}
function cloud(x,y,s,col='#b8c0cc'){ctx.save();ctx.translate(x,y);ctx.scale(s,s);
 for(const[dx,dy,r]of[[-90,10,60],[-30,-20,75],[40,-10,70],[100,15,55]])fillS(ell(dx,dy,r,r*.8,14),col,{w:3.5,a:2,alpha:.95});ctx.restore()}
function bubble(x,y,w,h,text,o={}){const p=o.p??1;if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(back(p),back(p));
 const tx=o.tail||[0,h/2+60];
 fillS([[-w/2+20,-h/2],[0,-h/2-3],[w/2-20,-h/2],[w/2,-h/2+20],[w/2+3,0],[w/2,h/2-20],[w/2-20,h/2],[tx[0]+30,h/2+4],tx,[tx[0]-10,h/2+4],[-w/2+20,h/2],[-w/2,h/2-20],[-w/2-3,0],[-w/2,-h/2+20]],o.fill||'#fffdf4',{w:4,a:1.6,alpha:1});
 txt(text,0,0,{size:o.size||48,col:o.col||INK});ctx.restore()}
function avatar(x,y,r,hair){fillS(ell(x,y,r,r,14),'#f6d3b0',{w:4});fillS(ell(x,y-r*.35,r*1.05,r*.65,12),hair,{w:3.5,a:1.5});
 fillS(ell(x-r*.35,y+r*.15,4,5,6),INK,{line:false,alpha:1});fillS(ell(x+r*.35,y+r*.15,4,5,6),INK,{line:false,alpha:1});stroke([[x-r*.3,y+r*.5],[x,y+r*.65],[x+r*.3,y+r*.5]],{w:3.5,a:.8});
 fillS(ell(x-r*.6,y+r*.45,9,6,6),'#f08a8a',{line:false,alpha:.5});fillS(ell(x+r*.6,y+r*.45,9,6,6),'#f08a8a',{line:false,alpha:.5})}
function stamp(x,y,r,p){if(p<=0)return;ctx.save();ctx.translate(x,y);ctx.rotate(-.2);const sc=back(p);ctx.scale(sc,sc);ctx.globalAlpha=.93;
 stroke(ell(0,0,r,r,26),{w:8,c:RED,close:true,a:2.5});stroke(ell(0,0,r*.84,r*.84,26),{w:3.5,c:RED,close:true,a:2});
 txt('好運來',0,-r*.08,{size:r*.62,col:RED});txt('LUCKY TOMATO',0,r*.56,{size:r*.17,col:RED});ctx.restore()}
function milk(x,y,ang,sc=1){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.scale(sc,sc);
 fillS(rrect(-34,-110,68,120,12),'#ffffff',{w:4,a:1.4});fillS(rrect(-18,-150,36,44,8),'#ffffff',{w:4,a:1});fillS(rrect(-22,-166,44,22,6),'#7bb6e8',{w:3.5,a:1});
 fillS(rrect(-26,-84,52,50,6),'#7bb6e8',{w:3,a:1,alpha:.6});txt('鮮奶',0,-59,{size:26,col:'#fff'});ctx.restore()}
function phone(x,y,rot,sc=1){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sc,sc);
 fillS(rrect(-42,-72,84,144,14),'#2b2b2e',{w:4,a:1});fillS(rrect(-34,-60,68,116,8),'#06c755',{w:3,a:1});txt('LINE',0,-8,{size:26,col:'#fff'});heart(0,24,12,'#fff');ctx.restore()}

/* ---------- subtitles ---------- */
const SUBS=[
 [.4,4,['好運來小番茄・高雄美濃','全高雄最大的小番茄產區｜橙蜜・玉女']],
 [4.3,9,['為什麼叫「好運來」？','因為老爸的名字，就叫「運來」']],
 [9.3,14,['連日大雨、通路不穩','他們停種了兩三年']],
 [14.3,19,['老朋友一直敲碗：什麼時候再種？','被敲碗敲回來——再試一次！']],
 [19.3,25,['媽媽下重本：鮮牛奶＋自家配方灌溉','採收時衣服擦一擦，就能直接吃']],
 [25.2,27.5,['女兒返鄉當後援，架起 LINE 官方帳號']],
 [27.7,30,['吃顆好運來，好運一直來']]];
function subtitles(t){for(const[a,b,L]of SUBS){if(t<a||t>b)continue;const p=Math.min(prog(t,a,a+.25),prog(t,b,b-.2));
 const bh=L.length>1?132:96,y0=(L.length>1?918:944);ctx.save();ctx.globalAlpha=ease(p);ctx.translate(0,(1-ease(p))*14);

/* ---------- render ---------- */
const BOUND=[4,9,14,19,25];
function render(t){
 FR=Math.floor(t*8);SC=0;
 ctx.globalAlpha=1;ctx.drawImage(paper,0,0);
 if(t<4)scene1(t);else if(t<9)scene2(t-4,t);else if(t<14)scene3(t-9,t);else if(t<19)scene4(t-14,t);else if(t<25)scene5(t-19,t);else scene6(t-25,t);
 for(const b of BOUND){const d=Math.abs(t-b);if(d<.18){ctx.globalAlpha=1-d/.18;ctx.drawImage(paper,0,0);ctx.globalAlpha=1}}
 if(t<.3){ctx.globalAlpha=1-t/.3;ctx.drawImage(paper,0,0);ctx.globalAlpha=1}
 if(t>29.6){ctx.globalAlpha=prog(t,29.6,30)*.0;ctx.globalAlpha=1}
 subtitles(t);footer(t);
}
window.render=render;window.READY=true;
