<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>美蘭 MV</title>
<style>html,body{margin:0;background:#222}canvas{display:block;margin:0 auto;max-width:100vw;max-height:100vh}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas>
<script src="timeline.js"></script>
<script src="scenes.js"></script>
<script>
// 預覽模式：直接開 mv.html 會跟著音樂播放（需 meilan.mp3）；渲染時由 render.js 呼叫 window.renderFrame(t)
(async()=>{
  await loadAll();
  window.ready=true;
  if(location.search.includes('play')){
    const a=new Audio('meilan.mp3');a.play();
    (function loop(){renderFrame(a.currentTime);requestAnimationFrame(loop)})();
  } else renderFrame(+(new URLSearchParams(location.search).get('t')||0));
})();
</script></body></html>
